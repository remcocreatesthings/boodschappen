<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Boodschappen" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Boodschappen</title>
</head>
<body>
  <main class="app">
    <header>
      <h1>Boodschappen</h1>
      <p class="subtitle">Zoek, voeg toe en vink af.</p>
    </header>

    <section class="search-card">
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="Zoek of voeg product toe…" autocomplete="off" />
        <button id="addCustomBtn" class="primary" type="button">Voeg toe</button>
      </div>
      <div id="suggestions" class="suggestions"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>Veel gebruikt</h2>
      </div>
      <div id="frequent" class="chips"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>Mijn lijst</h2>
        <button id="clearDoneBtn" class="text-btn" type="button">Wis afgevinkt</button>
      </div>
      <ul id="shoppingList" class="shopping-list"></ul>
      <p id="emptyState" class="empty">Je lijst is leeg.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
